<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerHub · 家庭服务器</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--txt:#1c1e21;--sub:#65676b;--line:#e4e6eb;
  --ok:#31a24c;--warn:#f7b928;--down:#e41e3f;--accent:#0866ff;--btn:#f0f2f5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111417;--card:#1c2126;--txt:#e7e9ea;--sub:#8b98a5;--line:#2f3336;
  --btn:#273038;--accent:#4a9eff;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;padding:16px;max-width:1080px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
h1{font-size:22px}
#summary{color:var(--sub);font-size:13px}
h2{font-size:14px;color:var(--sub);font-weight:600;margin:20px 0 8px;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.down{background:var(--down)}
.name{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{color:var(--sub);font-size:12px;margin:6px 0 10px;min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button,.lnk{border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--btn);color:var(--txt);text-decoration:none;display:inline-block}
button:active{transform:scale(.96)}
.lnk.primary{background:var(--accent);color:#fff}
button.danger{color:var(--down)}
button:disabled{opacity:.45;cursor:wait}
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .k{font-size:12px;color:var(--sub)}
.bar{height:5px;background:var(--btn);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:9}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.links a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--accent);font-size:14px;font-weight:600;text-decoration:none}
footer{color:var(--sub);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🖥 ServerHub</h1>
  <span id="summary">加载中…</span>
</header>

<h2>系统概览</h2>
<div class="sys" id="sys"></div>

<div id="groups"></div>

<h2>维护与更新</h2>
<div class="grid" id="maint"></div>

<h2>快捷入口</h2>
<div class="links" id="links"></div>

<div id="logbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8" onclick="if(event.target===this)closeLog()">
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:80vh;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column">
    <div class="row" style="margin-bottom:10px"><span class="name" id="logtitle">日志</span>
      <button onclick="closeLog()">关闭</button></div>
    <pre id="logtext" style="overflow:auto;font-size:12px;line-height:1.5;background:var(--bg);border-radius:8px;padding:10px;flex:1;white-space:pre-wrap"></pre>
  </div>
</div>

<footer>ServerHub · 服务清单来自自动发现 + services.yaml · 每 5 秒刷新 · <span id="ts"></span></footer>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const ACT={restart:"重启",stop:"停止",start:"启动",run:"立即运行"};
let busy=false;

function toast(msg){const t=$("toast");t.textContent=msg;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2800)}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

async function act(target,action,name){
  if(action==="stop"&&!confirm(`确定停止 ${name}？`))return;
  if(busy)return;busy=true;
  document.querySelectorAll("button").forEach(b=>b.disabled=true);
  toast(`正在执行：${name} ${ACT[action]}…`);
  try{
    const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target,action})});
    const j=await r.json();
    toast(j.ok?`✅ ${name}：${ACT[action]}完成 ${j.message?("· "+j.message.slice(0,60)):""}`:`❌ ${name}：${j.message.slice(0,90)}`);
  }catch(e){toast("❌ 请求失败："+e)}
  busy=false;
  setTimeout(refresh,1500);
}

function card(s){
  const btns=[];
  if(s.url)btns.push(`<a class="lnk primary" href="${esc(s.url)}" target="_blank">打开</a>`);
  for(const l of s.links||[])btns.push(`<a class="lnk" href="${esc(l.url)}" target="_blank">${esc(l.name)}</a>`);
  for(const a of s.actions||[])
    btns.push(`<button class="${a==="stop"?"danger":""}" onclick="act('${esc(s.id)}','${a}','${esc(s.name)}')">${ACT[a]}</button>`);
  return `<div class="card"><div class="row"><span class="dot ${s.state}"></span><span class="name" title="${esc(s.id)}">${esc(s.name)}</span></div>
    <div class="detail" title="${esc(s.detail)}">${esc(s.detail)}</div><div class="btns">${btns.join("")}</div></div>`;
}

function render(d){
  const c=d.counts;
  $("summary").textContent=`${c.ok} 正常 · ${c.warn} 警告 · ${c.down} 停止`;
  document.title=(c.down?`🔴${c.down} `: c.warn?`🟡 `:"🟢 ")+"ServerHub";
  const sys=d.system,sm=sys.smart||{};
  $("sys").innerHTML=
    `<div class="stat"><div class="k">负载 (1m/5m)</div><div class="v">${sys.load}</div></div>`+
    `<div class="stat"><div class="k">内存空闲</div><div class="v">${sys.mem_free_pct??"?"}%</div><div class="bar"><i style="width:${100-(sys.mem_free_pct??50)}%"></i></div></div>`+
    `<div class="stat"><div class="k">磁盘 ${sys.disk_used_gb}/${sys.disk_total_gb} GB</div><div class="v">${sys.disk_pct}%</div><div class="bar"><i style="width:${sys.disk_pct}%"></i></div></div>`+
    `<div class="stat"><div class="k">SSD 累计写入 · 磨损 ${sm.wear??"?"}</div><div class="v">${sm.written??"—"}</div></div>`+
    `<div class="stat"><div class="k">开机时长</div><div class="v" style="font-size:16px">${sys.uptime}</div></div>`;
  $("groups").innerHTML=d.groups.map(g=>
    `<h2>${esc(g.group)}</h2><div class="grid">${g.services.map(card).join("")}</div>`).join("");
  $("links").innerHTML=d.links.map(l=>`<a href="${esc(l.url)}" target="_blank">${esc(l.name)}</a>`).join("");
  $("ts").textContent="更新于 "+d.ts;
}

// ---- 维护任务 ----
let logTimer=null,curTask=null;

function maintCard(t){
  const badge=t.running?`<span style="color:var(--warn)">⏳ 运行中…</span>`
    :t.rc===null||t.rc===undefined?"":t.rc===0?`<span style="color:var(--ok)">✅ ${t.finished||""} 成功</span>`
    :`<span style="color:var(--down)">❌ 退出码 ${t.rc}</span>`;
  return `<div class="card"><div class="row"><span class="name">${esc(t.name)}</span></div>
    <div class="detail" style="white-space:normal;min-height:28px">${esc(t.desc)}</div>
    <div class="btns">
      <button onclick="runMaint('${esc(t.id)}',${t.confirm},'${esc(t.name)}')" ${t.running?"disabled":""}>运行</button>
      <button onclick="openLog('${esc(t.id)}','${esc(t.name)}')">日志</button>
      ${badge}</div></div>`;
}

async function refreshMaint(){
  try{const r=await fetch("/api/maintenance");const ts=await r.json();
    $("maint").innerHTML=ts.map(maintCard).join("");}catch(e){}
}

async function runMaint(id,needConfirm,name){
  if(needConfirm&&!confirm(`确定执行「${name}」？`))return;
  const r=await fetch(`/api/maintenance/${id}/run`,{method:"POST"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){toast("❌ "+(j.detail||"启动失败"));return}
  toast(`🚀 ${name} 已开始`);
  refreshMaint();openLog(id,name);
}

async function pollLog(){
  if(!curTask)return;
  try{
    const r=await fetch(`/api/maintenance/${curTask}/log`);const j=await r.json();
    const el=$("logtext");
    const stick=el.scrollTop+el.clientHeight>=el.scrollHeight-30;
    el.textContent=j.log+(j.running?"\n⏳ 运行中…":j.rc===null?"":`\n—— 结束（退出码 ${j.rc}）`);
    if(stick)el.scrollTop=el.scrollHeight;
    if(!j.running){clearInterval(logTimer);logTimer=null;refreshMaint();}
  }catch(e){}
}

function openLog(id,name){
  curTask=id;$("logtitle").textContent="📋 "+name;$("logbox").style.display="block";
  $("logtext").textContent="加载中…";
  pollLog();
  if(logTimer)clearInterval(logTimer);
  logTimer=setInterval(pollLog,1500);
}
function closeLog(){$("logbox").style.display="none";curTask=null;
  if(logTimer){clearInterval(logTimer);logTimer=null}}

async function refresh(){
  try{const r=await fetch("/api/status");render(await r.json())}
  catch(e){$("summary").textContent="⚠️ 面板后端无响应"}
  refreshMaint();
}
refresh();
setInterval(()=>{if(!busy)refresh()},5000);
</script>
</body>
</html>
