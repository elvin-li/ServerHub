<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="ServerHub">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2724"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="accent" x1="18" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff8c2f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f4f1ec" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d8d2c8" stop-opacity=".75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.2" stroke="#fff" stroke-opacity=".08"/>

  <!-- Soft inner stage -->
  <rect x="11" y="12" width="42" height="40" rx="10" fill="#000" fill-opacity=".22"/>

  <!-- Server stack (3 bays) -->
  <g>
    <rect x="16" y="17" width="24" height="9" rx="2.5" fill="url(#bar)"/>
    <circle cx="20.5" cy="21.5" r="1.35" fill="#3fa33f"/>
    <rect x="24" y="20.4" width="11" height="2.1" rx="1" fill="#1c1b1b" fill-opacity=".28"/>

    <rect x="16" y="28" width="24" height="9" rx="2.5" fill="url(#bar)"/>
    <circle cx="20.5" cy="32.5" r="1.35" fill="#ff8c2f"/>
    <rect x="24" y="31.4" width="11" height="2.1" rx="1" fill="#1c1b1b" fill-opacity=".28"/>

    <rect x="16" y="39" width="24" height="9" rx="2.5" fill="url(#bar)"/>
    <circle cx="20.5" cy="43.5" r="1.35" fill="#3fa33f"/>
    <rect x="24" y="42.4" width="11" height="2.1" rx="1" fill="#1c1b1b" fill-opacity=".28"/>
  </g>

  <!-- Hub node + links (right) -->
  <g filter="url(#soft)">
    <path d="M40 22.5 C44 22.5 46 26 46 32 C46 38 44 41.5 40 41.5"
          stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <circle cx="48" cy="32" r="5.5" fill="url(#accent)"/>
    <circle cx="48" cy="32" r="2.1" fill="#1c1b1b" fill-opacity=".35"/>
  </g>
</svg>
