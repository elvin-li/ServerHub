    <text x="310" y="219" fill="#242522" font-size="34" font-weight="760">28%</text>
    <text x="396" y="218" fill="#777872" font-size="15">utilization</text>
    <text x="310" y="260" fill="#3c3d39" font-size="16" font-weight="600">Illustrative 12-core CPU</text>
    <text x="310" y="287" fill="#777872" font-size="14">Load averages  ·  2.1  /  1.8  /  1.5</text>
    <rect x="310" y="305" width="274" height="8" rx="4" fill="#eeeae5"/>
    <rect x="310" y="305" width="77" height="8" rx="4" fill="#ff8c2f"/>

    <text x="670" y="171" fill="#686963" font-size="14" font-weight="650">MEMORY</text>
    <text x="670" y="219" fill="#242522" font-size="34" font-weight="760">37.6 GB</text>
    <text x="670" y="248" fill="#777872" font-size="15">of 64 GB available</text>
    <text x="670" y="287" fill="#3c3d39" font-size="15" font-weight="600">41% in active use</text>
    <rect x="670" y="305" width="274" height="8" rx="4" fill="#e6edf5"/>
    <rect x="670" y="305" width="112" height="8" rx="4" fill="#58a6ff"/>

    <text x="1030" y="171" fill="#686963" font-size="14" font-weight="650">SERVICE HEALTH</text>
    <text x="1030" y="219" fill="#242522" font-size="34" font-weight="760">All operational</text>
    <circle cx="1040" cy="263" r="7" fill="#55c47a"/>
    <text x="1058" y="269" fill="#3c3d39" font-size="16" font-weight="600">9 services responding</text>
    <text x="1030" y="304" fill="#777872" font-size="14">Last sample refreshed moments ago</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="365" width="716" height="475" rx="18" fill="#fff"/>
    <rect x="1020" y="365" width="372" height="475" rx="18" fill="#fff"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="312" y="410" fill="#242522" font-size="20" font-weight="720">Resource activity</text>
    <text x="312" y="435" fill="#777872" font-size="13">Processor and memory utilization · sample timeline</text>
    <line x1="312" y1="489" x2="964" y2="489" stroke="#ecebe7"/>
    <line x1="312" y1="563" x2="964" y2="563" stroke="#ecebe7"/>
    <line x1="312" y1="637" x2="964" y2="637" stroke="#ecebe7"/>
    <line x1="312" y1="711" x2="964" y2="711" stroke="#ecebe7"/>
    <path d="M312 678 C350 632 388 661 426 604 S501 569 540 603 S615 650 654 578 S728 521 768 560 S843 639 884 567 S932 517 964 538" fill="none" stroke="#ff8c2f" stroke-width="4" stroke-linecap="round"/>
    <path d="M312 627 C360 599 397 612 438 591 S515 604 556 570 S633 542 674 559 S751 583 792 551 S869 529 910 548 S947 554 964 547" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="324" cy="785" r="6" fill="#ff8c2f"/><text x="339" y="790" fill="#565752" font-size="13">Processor</text>
    <circle cx="427" cy="785" r="6" fill="#58a6ff"/><text x="442" y="790" fill="#565752" font-size="13">Memory</text>

    <text x="1052" y="410" fill="#242522" font-size="20" font-weight="720">Storage</text>
    <text x="1052" y="435" fill="#777872" font-size="13">Fictional volume labels and values</text>
    <text x="1052" y="490" fill="#3c3d39" font-size="15" font-weight="650">Primary volume</text>
    <text x="1334" y="490" fill="#777872" font-size="13" text-anchor="end">46% used</text>
    <rect x="1052" y="507" width="308" height="10" rx="5" fill="#eeeae5"/>
    <rect x="1052" y="507" width="142" height="10" rx="5" fill="#ff8c2f"/>
    <text x="1052" y="559" fill="#3c3d39" font-size="15" font-weight="650">Archive volume</text>
    <text x="1334" y="559" fill="#777872" font-size="13" text-anchor="end">63% used</text>
    <rect x="1052" y="576" width="308" height="10" rx="5" fill="#eeeae5"/>
    <rect x="1052" y="576" width="194" height="10" rx="5" fill="#58a6ff"/>
    <line x1="1052" y1="626" x2="1360" y2="626" stroke="#ecebe7"/>
    <text x="1052" y="670" fill="#686963" font-size="13" font-weight="650">RECENT CHECKS</text>
    <circle cx="1061" cy="706" r="6" fill="#55c47a"/><text x="1078" y="711" fill="#3c3d39" font-size="14">Storage health normal</text>
    <circle cx="1061" cy="749" r="6" fill="#55c47a"/><text x="1078" y="754" fill="#3c3d39" font-size="14">Backup policy active</text>
    <circle cx="1061" cy="792" r="6" fill="#55c47a"/><text x="1078" y="797" fill="#3c3d39" font-size="14">No pending alerts</text>
  </g>
</svg>
