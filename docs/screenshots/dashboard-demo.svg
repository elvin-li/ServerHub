<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ServerHub system overview with fictional demo data</title>
  <desc id="desc">A sanitized ServerHub dashboard mockup showing fictional processor, memory, storage, and service status data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#efeee9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#392817" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="236" height="900" fill="#20211f"/>
  <circle cx="42" cy="48" r="18" fill="#ff8c2f"/>
  <path d="M34 48h16M42 40v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="56" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700">ServerHub</text>
  <rect x="20" y="98" width="196" height="46" rx="10" fill="#343531"/>
  <rect x="20" y="98" width="4" height="46" rx="2" fill="#ff8c2f"/>
  <text x="48" y="128" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600">Overview</text>
  <g fill="#b8b9b4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">
    <text x="48" y="185">Applications</text><text x="48" y="237">Services</text>
    <text x="48" y="289">Storage</text><text x="48" y="341">Network</text>
    <text x="48" y="393">Logs</text><text x="48" y="445">Settings</text>
  </g>
  <rect x="20" y="808" width="196" height="58" rx="12" fill="#2b2c29"/>
  <circle cx="47" cy="837" r="7" fill="#55c47a"/>
  <text x="65" y="833" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600">Demo workspace</text>
  <text x="65" y="851" fill="#a9aaa5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">Fictional sample data</text>

  <text x="280" y="70" fill="#242522" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="750">System overview</text>
  <text x="280" y="99" fill="#777872" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">A clear view of compute, storage, and running services</text>
  <rect x="1190" y="42" width="202" height="42" rx="21" fill="#fff1e6" stroke="#ff8c2f" stroke-width="1.5"/>
  <circle cx="1217" cy="63" r="6" fill="#ff8c2f"/>
  <text x="1233" y="68" fill="#a94f0c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">DEMO DATA · FICTIONAL</text>

  <g filter="url(#shadow)">
    <rect x="280" y="132" width="336" height="205" rx="18" fill="#fff"/>
    <rect x="640" y="132" width="336" height="205" rx="18" fill="#fff"/>
    <rect x="1000" y="132" width="392" height="205" rx="18" fill="#fff"/>
  </g>
  <rect x="280" y="132" width="5" height="205" rx="3" fill="#ff8c2f"/>
