<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ServerHub system overview with fictional demo data</title>
  <desc id="desc">A sanitized ServerHub dashboard mockup in the macOS theme showing fictional processor, memory, network, and Top CPU data.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity=".06"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F5F5F7"/>
  <!-- top chrome -->
  <rect x="0" y="0" width="1440" height="44" fill="#F6F6F7" opacity=".92"/>
  <rect x="0" y="43" width="1440" height="1" fill="#E5E5EA"/>
  <rect x="16" y="11" width="22" height="22" rx="6" fill="#007AFF"/>
  <text x="48" y="28" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="14" font-weight="700">ServerHub</text>
  <g fill="#6e6e73" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="12.5">
    <text x="180" y="28" fill="#007AFF" font-weight="600">Overview</text>
    <text x="270" y="28">Apps</text>
    <text x="330" y="28">Services</text>
    <text x="410" y="28">Shares</text>
    <text x="480" y="28">Storage</text>
  </g>
  <rect x="1260" y="10" width="164" height="24" rx="6" fill="#FFF1E6" stroke="#FF9F0A" stroke-width="1"/>
  <text x="1274" y="26" fill="#C93400" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="11" font-weight="600">DEMO  -  FICTIONAL</text>

  <!-- host strip -->
  <rect x="20" y="58" width="1400" height="40" rx="10" fill="#fff" filter="url(#shadow)" stroke="#E5E5EA"/>
  <text x="36" y="83" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="13" font-weight="600">demo-mac.local</text>
  <text x="180" y="83" fill="#6e6e73" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="12">8 cores  -  32 GB  -  load 1.4</text>
  <rect x="1280" y="68" width="54" height="20" rx="6" fill="rgba(52,199,89,.14)"/>
  <text x="1292" y="82" fill="#248a3d" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="11" font-weight="600">OK 9</text>

  <!-- resource tiles -->
  <g filter="url(#shadow)">
    <rect x="20" y="110" width="460" height="168" rx="10" fill="#fff" stroke="#E5E5EA"/>
    <rect x="490" y="110" width="460" height="168" rx="10" fill="#fff" stroke="#E5E5EA"/>
    <rect x="960" y="110" width="460" height="168" rx="10" fill="#fff" stroke="#E5E5EA"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif">
    <text x="36" y="136" fill="#6e6e73" font-size="11" font-weight="600">CPU</text>
    <text x="36" y="172" fill="#1d1d1f" font-size="28" font-weight="700">18%</text>
    <rect x="36" y="190" width="420" height="6" rx="3" fill="#E5E5EA"/>
    <rect x="36" y="190" width="76" height="6" rx="3" fill="#007AFF"/>
    <text x="36" y="222" fill="#6e6e73" font-size="12">Load 1.4 / 1.1 / 0.9  -  8 cores</text>

    <text x="506" y="136" fill="#6e6e73" font-size="11" font-weight="600">MEMORY</text>
    <text x="506" y="172" fill="#1d1d1f" font-size="28" font-weight="700">12.4 GB</text>
    <text x="506" y="198" fill="#6e6e73" font-size="12">of 32 GB  -  pressure 41%</text>
    <rect x="506" y="214" width="420" height="6" rx="3" fill="#E5E5EA"/>
    <rect x="506" y="214" width="172" height="6" rx="3" fill="#007AFF"/>

    <text x="976" y="136" fill="#6e6e73" font-size="11" font-weight="600">DISK</text>
    <text x="976" y="172" fill="#1d1d1f" font-size="28" font-weight="700">48%</text>
    <text x="976" y="198" fill="#6e6e73" font-size="12">Macintosh HD  -  SMART OK</text>
    <rect x="976" y="214" width="420" height="6" rx="3" fill="#E5E5EA"/>
    <rect x="976" y="214" width="202" height="6" rx="3" fill="#007AFF"/>
  </g>

  <!-- net + top cpu -->
  <g filter="url(#shadow)">
    <rect x="20" y="292" width="700" height="280" rx="10" fill="#fff" stroke="#E5E5EA"/>
    <rect x="740" y="292" width="680" height="280" rx="10" fill="#fff" stroke="#E5E5EA"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif">
    <text x="36" y="320" fill="#1d1d1f" font-size="13" font-weight="700">Network  -  Processes</text>
    <rect x="36" y="340" width="208" height="64" rx="8" fill="#F5F5F7"/>
    <rect x="256" y="340" width="208" height="64" rx="8" fill="#F5F5F7"/>
    <rect x="476" y="340" width="208" height="64" rx="8" fill="#F5F5F7"/>
    <text x="48" y="362" fill="#6e6e73" font-size="11">↓ RX</text>
    <text x="48" y="386" fill="#1d1d1f" font-size="16" font-weight="700">1.2 MB/s</text>
    <text x="268" y="362" fill="#6e6e73" font-size="11">↑ TX</text>
    <text x="268" y="386" fill="#1d1d1f" font-size="16" font-weight="700">340 KB/s</text>
    <text x="488" y="362" fill="#6e6e73" font-size="11">Processes</text>
    <text x="488" y="386" fill="#1d1d1f" font-size="16" font-weight="700">512 <tspan fill="#6e6e73" font-size="12" font-weight="500">run 8</tspan></text>

    <text x="36" y="440" fill="#1d1d1f" font-size="13" font-weight="700">TOP CPU</text>
    <text x="36" y="470" fill="#6e6e73" font-size="11">WindowServer</text>
    <text x="280" y="470" fill="#1d1d1f" font-size="12" font-family="ui-monospace,Menlo,monospace">12.4%</text>
    <text x="36" y="496" fill="#6e6e73" font-size="11">kernel_task</text>
    <text x="280" y="496" fill="#1d1d1f" font-size="12" font-family="ui-monospace,Menlo,monospace">8.1%</text>
    <text x="36" y="522" fill="#6e6e73" font-size="11">Docker</text>
    <text x="280" y="522" fill="#1d1d1f" font-size="12" font-family="ui-monospace,Menlo,monospace">6.2%</text>

    <text x="756" y="320" fill="#1d1d1f" font-size="13" font-weight="700">Services</text>
    <text x="756" y="356" fill="#1d1d1f" font-size="13">Home Assistant</text>
    <rect x="1280" y="340" width="52" height="20" rx="6" fill="rgba(52,199,89,.14)"/>
    <text x="1292" y="354" fill="#248a3d" font-size="11" font-weight="600">OK</text>
    <text x="756" y="396" fill="#1d1d1f" font-size="13">Nginx</text>
    <rect x="1280" y="380" width="52" height="20" rx="6" fill="rgba(52,199,89,.14)"/>
    <text x="1292" y="394" fill="#248a3d" font-size="11" font-weight="600">OK</text>
    <text x="756" y="436" fill="#1d1d1f" font-size="13">Ollama</text>
    <rect x="1280" y="420" width="52" height="20" rx="6" fill="rgba(52,199,89,.14)"/>
    <text x="1292" y="434" fill="#248a3d" font-size="11" font-weight="600">OK</text>
    <text x="756" y="476" fill="#6e6e73" font-size="12">Fictional sample services  -  no real hosts</text>
  </g>

  <text x="20" y="880" fill="#98989d" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif" font-size="11">ServerHub  -  macOS theme preview  -  entirely fictional demo data</text>
</svg>
