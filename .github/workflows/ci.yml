name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install panel Python dependencies
        run: |
          python -m pip install --upgrade pip
          # rumps / pyobjc are macOS-only; the panel tests do not need them.
          grep -vE '^(rumps|pyobjc)' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Backend tests
        run: python -m unittest discover -s tests -q
      - name: Frontend tests
        run: |
          npm --prefix web ci
          npm --prefix web test
