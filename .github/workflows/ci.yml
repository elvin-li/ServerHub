name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install panel Python dependencies
        run: |
          python -m pip install --upgrade pip
          # rumps / pyobjc are macOS-only; the panel tests do not need them.
          grep -vE '^(rumps|pyobjc)' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Backend tests
        run: python -m unittest discover -s tests -q
      - name: Frontend tests
        run: |
          npm --prefix web ci
          npm --prefix web test
      - name: Dead code
        run: npm --prefix web run check:dead-code
      # `static/` is the panel that actually ships: the backend serves it off
      # disk and it is committed to the repo. Nothing here built it, so a
      # change to `web/` merged green while the served panel stayed on the
      # previous build. Vite's output is content-hashed and reproducible from
      # the lockfile, so rebuilding and diffing is an exact check.
      - name: Built panel matches web/
        run: |
          npm --prefix web run build
          git diff --exit-code --stat static/ || {
            echo "::error::static/ is out of date — run 'npm --prefix web run build' and commit the result"
            exit 1
          }
