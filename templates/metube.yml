---
name: MeTube
desc: Web UI for yt-dlp · download videos and audio from YouTube and 1000+ sites
category: download
tags: [youtube, video, download]
ports: ["8281"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: Paste a URL, pick a format, done. Downloads land in the folder below; audio-only extraction and playlists are supported.
vars:
  - name: HOST_PORT
    label: Web port
    default: "8281"
    help: Host port 8081 is used by the qBittorrent template, so this maps 8281 instead
  - name: DOWNLOADS_PATH
    label: Downloads folder (host)
    default: "{{SERVICES}}/metube/downloads"
---
services:
  metube:
    image: alexta69/metube:2026.08.04
    container_name: metube
    restart: unless-stopped
    environment:
      - UID=1000
      - GID=1000
      - TZ={{TZ}}
    ports:
      - "{{HOST_PORT}}:8081"
    volumes:
      - "{{DOWNLOADS_PATH}}:/downloads"
