---
name: Grafana + Prometheus
desc: Metrics dashboard and time-series database bundle · Prometheus scrapes, Grafana visualizes
category: monitor
tags: [metrics, dashboard, observability]
featured: true
ports: ["3300", "9090"]
url_template: "http://{{HOST_IP}}:{{GRAFANA_PORT}}"
notes: |
  Sign in to Grafana with the admin user and password below; the Prometheus data source is pre-provisioned.
  Add scrape targets by editing prometheus/prometheus.yml inside the stack folder and restarting the stack.
vars:
  - name: GRAFANA_PORT
    label: Grafana web port
    default: "3300"
  - name: PROMETHEUS_PORT
    label: Prometheus web port
    default: "9090"
  - name: ADMIN_USER
    label: Grafana admin user
    default: "admin"
  - name: ADMIN_PASSWORD
    label: Grafana admin password
    default: "__RANDOM__"
    secret: true
bootstrap_files:
  - path: prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
  - path: grafana-provisioning/datasources/prometheus.yml
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
---
services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER={{ADMIN_USER}}
      - GF_SECURITY_ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      - TZ={{TZ}}
    ports:
      - "{{GRAFANA_PORT}}:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "{{PROMETHEUS_PORT}}:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - ./prometheus-data:/prometheus
