---
name: Dockge
desc: Compose stack management UI (complements ServerHub and is handy for comparison)
vars:
  - name: HOST_PORT
    label: Web port
    default: "5001"
  - name: STACKS_DIR
    label: Stacks directory
    default: "{{SERVICES}}"
category: ops
tags: [compose]
ports: ["5001"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
---
services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "{{HOST_PORT}}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - "{{STACKS_DIR}}:/opt/stacks"
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
