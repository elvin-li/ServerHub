---
name: Redis
desc: In-memory database / cache
category: data
tags: [cache, db]
ports: ["6379"]
vars:
  - name: HOST_PORT
    label: Port
    default: "6379"
  - name: PASSWORD
    label: Password (optional)
    default: ""
    required: false
    secret: true
---
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "{{PASSWORD}}" ]; then redis-server --requirepass "{{PASSWORD}}"; else redis-server; fi'
    ports:
      - "{{HOST_PORT}}:6379"
    volumes:
      - ./data:/data
