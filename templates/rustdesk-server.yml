---
name: RustDesk relay server
desc: Self-hosted remote desktop relay (a TeamViewer alternative) · clients just need the ID server address
category: remote
tags: [remote, rustdesk, rdp]
featured: true
ports: ["21115-21119", "21116/udp"]
url_template: ""
notes: |
  After deployment, open Network in the RustDesk client and set the ID server to this machine's IP.
  Ports 21115-21119/tcp and 21116/udp must be open. Keys are kept in the ./data folder.
vars:
  - name: RELAY_HOST
    label: Relay host IP / domain
    default: ""
    required: false
    help: Optional; leave blank to enter this machine's LAN or public IP manually in the client
---
services:
  hbbs:
    container_name: rustdesk-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped
  hbbr:
    container_name: rustdesk-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
