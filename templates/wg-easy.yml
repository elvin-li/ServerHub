---
name: WireGuard (wg-easy)
desc: WireGuard VPN with a web admin UI · scan a QR code to connect a phone or laptop
category: network
tags: [vpn, wireguard, remote-access]
featured: true
ports: ["51820/udp", "51821"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: |
  On macOS/OrbStack, VPN containers are limited by the virtual network, so some setups need extra configuration.
  After deployment, open the web UI to add clients and scan their QR codes. Set WG_HOST to your public IP or domain (or your tunnel hostname).
  Forward UDP 51820 on your router to this machine.
vars:
  - name: WG_HOST
    label: Public IP / domain
    default: ""
    required: true
    help: Hostname or public IP that clients connect to (required)
  - name: PASSWORD
    label: Web admin password
    default: "__RANDOM__"
    secret: true
    help: Password for signing in to the wg-easy panel
  - name: HOST_PORT
    label: Web port
    default: "51821"
  - name: WG_PORT
    label: WireGuard UDP port
    default: "51820"
  - name: WG_DEFAULT_DNS
    label: Client DNS
    default: "1.1.1.1"
---
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    environment:
      - LANG=en
      - WG_HOST={{WG_HOST}}
      - PASSWORD={{PASSWORD}}
      - WG_PORT={{WG_PORT}}
      - WG_DEFAULT_DNS={{WG_DEFAULT_DNS}}
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - WG_PERSISTENT_KEEPALIVE=25
    volumes:
      - ./data:/etc/wireguard
    ports:
      - "{{WG_PORT}}:{{WG_PORT}}/udp"
      - "{{HOST_PORT}}:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
