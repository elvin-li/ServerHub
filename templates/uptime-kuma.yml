---
name: Uptime Kuma
desc: A polished self-hosted uptime monitoring dashboard
vars:
  - name: HOST_PORT
    label: Host port
    default: "3001"
    help: Port used to reach the web interface
category: monitor
featured: true
tags: [monitor]
ports: ["3001"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "{{HOST_PORT}}:3001"
    volumes:
      - ./data:/app/data
