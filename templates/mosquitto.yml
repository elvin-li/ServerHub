---
name: Mosquitto MQTT
desc: MQTT broker · message bus for Home Assistant and IoT devices
category: iot
tags: [mqtt, iot, ha]
featured: true
ports: ["1883", "9883"]
url_template: ""
notes: Anonymous connections are allowed by default, which suits a home LAN. For production, edit the config to require user authentication.
vars:
  - name: MQTT_PORT
    label: MQTT port
    default: "1883"
  - name: WS_PORT
    label: WebSocket port
    default: "9883"
bootstrap_files:
  - path: config/mosquitto.conf
    content: |
      listener 1883
      allow_anonymous true
      listener 9001
      protocol websockets
      allow_anonymous true
      persistence true
      persistence_location /mosquitto/data/
---
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "{{MQTT_PORT}}:1883"
      - "{{WS_PORT}}:9001"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
