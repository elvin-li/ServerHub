---
name: Glance
desc: Lightweight aggregated dashboard (RSS, weather, service status) — a polished open-source panel
vars:
  - name: HOST_PORT
    label: Web port
    default: "8087"
category: dashboard
tags: [dashboard]
ports: ["8087"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
---
services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "{{HOST_PORT}}:8080"
    volumes:
      - ./config:/app/config
