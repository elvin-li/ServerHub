---
name: PostgreSQL
desc: Relational database
category: data
tags: [db, sql]
ports: ["5432"]
vars:
  - name: HOST_PORT
    label: Port
    default: "5432"
  - name: POSTGRES_USER
    label: User
    default: "app"
  - name: POSTGRES_PASSWORD
    label: Password
    default: "__RANDOM__"
    secret: true
  - name: POSTGRES_DB
    label: Database name
    default: "app"
---
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER={{POSTGRES_USER}}
      - POSTGRES_PASSWORD={{POSTGRES_PASSWORD}}
      - POSTGRES_DB={{POSTGRES_DB}}
    ports:
      - "{{HOST_PORT}}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
