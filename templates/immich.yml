---
name: Immich
desc: Self-hosted photo library (a Google Photos alternative) · trimmed-down official compose
category: media
tags: [photos, gallery]
featured: true
ports: ["2283"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: |
  The full official stack is heavy; this template ships the common trimmed-down set (server + postgres + redis + machine-learning).
  The first image pull is large. Uploads are stored in ./library.
vars:
  - name: HOST_PORT
    label: Web port
    default: "2283"
  - name: DB_PASSWORD
    label: Database password
    default: "__RANDOM__"
    secret: true
  - name: UPLOAD_PATH
    label: Photo library path
    default: "{{SERVICES}}/immich/library"
---
name: immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - "{{UPLOAD_PATH}}:/usr/src/app/upload"
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD={{DB_PASSWORD}}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - UPLOAD_LOCATION=/usr/src/app/upload
    ports:
      - "{{HOST_PORT}}:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - ./model-cache:/cache
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD={{DB_PASSWORD}}
      - DB_DATABASE_NAME=immich
    restart: unless-stopped
  redis:
    container_name: immich-redis
    image: redis:6.2-alpine
    restart: unless-stopped
  database:
    container_name: immich-postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      - POSTGRES_PASSWORD={{DB_PASSWORD}}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
