---
name: code-server
desc: VS Code in the browser · remote development
category: dev
tags: [ide, vscode]
featured: true
ports: ["8443"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: Port
    default: "8443"
  - name: PASSWORD
    label: Password
    default: "__RANDOM__"
    secret: true
  - name: WORKSPACE
    label: Workspace directory
    default: "{{SERVICES}}"
---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{TZ}}
      - PASSWORD={{PASSWORD}}
      - DEFAULT_WORKSPACE=/workspace
    volumes:
      - ./config:/config
      - "{{WORKSPACE}}:/workspace"
    ports:
      - "{{HOST_PORT}}:8443"
    restart: unless-stopped
