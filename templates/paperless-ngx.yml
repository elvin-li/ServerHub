---
name: Paperless-ngx
desc: Document scanning, archiving and OCR · digital receipt management
category: productivity
tags: [docs, ocr]
ports: ["8010"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: The first start is slow. The default user is generated in the logs or set through environment variables.
vars:
  - name: HOST_PORT
    label: Port
    default: "8010"
  - name: PAPERLESS_ADMIN_USER
    label: Admin user
    default: "admin"
  - name: PAPERLESS_ADMIN_PASSWORD
    label: Admin password
    default: "__RANDOM__"
    secret: true
---
services:
  broker:
    image: redis:7
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "{{HOST_PORT}}:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_ADMIN_USER={{PAPERLESS_ADMIN_USER}}
      - PAPERLESS_ADMIN_PASSWORD={{PAPERLESS_ADMIN_PASSWORD}}
      - PAPERLESS_OCR_LANGUAGE={{OCR_LANG}}
      - PAPERLESS_TIME_ZONE={{TZ}}
