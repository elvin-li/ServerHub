---
name: IT-Tools
desc: A collection of handy IT utilities (encoding, hashing, JWT, ports and more)
category: productivity
tags: [tools, utils]
featured: true
ports: ["8083"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: Port
    default: "8083"
---
services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    ports:
      - "{{HOST_PORT}}:80"
    restart: unless-stopped
