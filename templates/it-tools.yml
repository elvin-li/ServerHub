---
name: IT-Tools
desc: 运维小工具合集（编码/哈希/JWT/端口等）
category: productivity
tags: [tools, utils]
featured: true
ports: ["8083"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: 端口
    default: "8083"
---
services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    ports:
      - "{{HOST_PORT}}:80"
    restart: unless-stopped
