---
name: Jellyfin
desc: Free open-source media server (Plex alternative)
category: media
tags: [media, video]
featured: true
ports: ["8096"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: Point MEDIA_PATH at your movies and TV directory. You can edit the compose file later to enable hardware transcoding.
vars:
  - name: HOST_PORT
    label: Web port
    default: "8096"
  - name: MEDIA_PATH
    label: Media directory (host)
    default: "{{SERVICES}}/media"
    help: Media directory mounted into the container
  - name: TZ
    label: Time zone
    default: "{{TZ}}"
---
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ={{TZ}}
    ports:
      - "{{HOST_PORT}}:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - "{{MEDIA_PATH}}:/media"
