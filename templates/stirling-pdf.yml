---
name: Stirling PDF
desc: Browser-based PDF toolkit (merge / split / OCR / convert)
category: productivity
tags: [pdf, tools]
featured: true
ports: ["8082"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: Port
    default: "8082"
---
services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS={{UI_LANGS}}
    ports:
      - "{{HOST_PORT}}:8080"
    volumes:
      - ./data:/usr/share/tessdata
    restart: unless-stopped
