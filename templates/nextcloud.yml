---
name: Nextcloud
desc: Private cloud drive / photos / office suite
category: files
tags: [cloud, files]
featured: true
ports: ["8084"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: Open it for the first time to complete the setup wizard. For production, add Postgres and an HTTPS reverse proxy.
vars:
  - name: HOST_PORT
    label: Port
    default: "8084"
---
services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "{{HOST_PORT}}:80"
    volumes:
      - ./html:/var/www/html
      - ./data:/var/www/html/data
