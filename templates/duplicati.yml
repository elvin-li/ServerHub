---
name: Duplicati
desc: Encrypted backups to cloud storage, S3 or local disks
category: backup
tags: [backup]
ports: ["8201"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: The port defaults to 8201 (still 8200 inside the container); change HOST_PORT if it clashes with another service.
vars:
  - name: HOST_PORT
    label: Port
    default: "8201"
  - name: BACKUP_SOURCE
    label: Host directory to back up
    default: "{{SERVICES}}"
---
services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{TZ}}
    volumes:
      - ./config:/config
      - ./backups:/backups
      - "{{BACKUP_SOURCE}}:/source:ro"
    ports:
      - "{{HOST_PORT}}:8200"
    restart: unless-stopped
