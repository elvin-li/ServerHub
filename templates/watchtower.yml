---
name: Watchtower
desc: 自动更新 Docker 容器镜像（谨慎开启）
category: ops
tags: [update, docker]
ports: []
notes: 默认每天检查。生产环境建议先用 monitor-only 或排除关键容器。
vars:
  - name: SCHEDULE
    label: Cron 计划
    default: "0 4 * * *"
    help: 默认每天凌晨 4 点
---
services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE={{SCHEDULE}}
      - WATCHTOWER_INCLUDE_RESTARTING=true
