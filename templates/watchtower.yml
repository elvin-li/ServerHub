---
name: Watchtower
desc: Automatically update Docker container images (enable with care)
category: ops
tags: [update, docker]
ports: []
notes: Checks for updates daily by default. In production, start with monitor-only mode or exclude critical containers.
vars:
  - name: SCHEDULE
    label: Cron schedule
    default: "0 4 * * *"
    help: Defaults to 4 AM every day
---
services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE={{SCHEDULE}}
      - WATCHTOWER_INCLUDE_RESTARTING=true
