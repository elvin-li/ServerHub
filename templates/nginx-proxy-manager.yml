---
name: Nginx Proxy Manager
desc: Visual reverse proxy / SSL certificates · put domains in front of LAN services
category: network
tags: [proxy, ssl, npm]
featured: true
ports: ["81", "8080", "4443"]
url_template: "http://{{HOST_IP}}:{{ADMIN_PORT}}"
notes: |
  Default administrator is admin@example.com / changeme; you must change the password at first login.
  Host ports default to 8080 (HTTP) / 4443 (HTTPS) / 81 (admin); inside the container they stay 80/443/81.
  To serve 80/443 directly, make sure the local nginx is stopped and the container may bind privileged ports.
vars:
  - name: ADMIN_PORT
    label: Admin port
    default: "81"
  - name: HTTP_PORT
    label: HTTP port
    default: "8080"
  - name: HTTPS_PORT
    label: HTTPS port
    default: "4443"
---
services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "{{HTTP_PORT}}:80"
      - "{{HTTPS_PORT}}:443"
      - "{{ADMIN_PORT}}:81"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
