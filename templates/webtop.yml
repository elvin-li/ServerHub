---
name: Webtop remote desktop
desc: A full Linux desktop in your browser (VNC/noVNC) · handy backup for remote work
category: remote
tags: [vnc, desktop, remote]
featured: true
ports: ["3020"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: |
  Built on linuxserver/webtop and reachable straight from a browser, with no separate VNC client.
  The first start is slow while the image downloads. Setting a password is recommended. Not suited to 24/7 high-load gaming.
vars:
  - name: HOST_PORT
    label: Web port
    default: "3020"
  - name: PASSWORD
    label: Sign-in password
    default: "__RANDOM__"
    secret: true
    help: Password requested when you open the desktop in a browser
  - name: TZ
    label: Time zone
    default: "{{TZ}}"
---
services:
  webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: webtop
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{TZ}}
      - SUBFOLDER=/
      - TITLE=ServerHub Webtop
      - PASSWORD={{PASSWORD}}
    volumes:
      - ./config:/config
      - ./data:/config/Desktop/data
    ports:
      - "{{HOST_PORT}}:3000"
    shm_size: "1gb"
    restart: unless-stopped
