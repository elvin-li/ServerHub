---
name: Dozzle
desc: 实时查看 Docker 容器日志（轻量）
category: monitor
tags: [logs, docker]
featured: true
ports: ["8888"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: 端口
    default: "8888"
---
services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "{{HOST_PORT}}:8080"
    restart: unless-stopped
