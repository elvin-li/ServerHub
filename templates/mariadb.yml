---
name: MariaDB
desc: MySQL-compatible database
category: data
tags: [db, mysql]
ports: ["3306"]
vars:
  - name: HOST_PORT
    label: Port
    default: "3306"
  - name: MYSQL_ROOT_PASSWORD
    label: Root password
    default: "__RANDOM__"
    secret: true
  - name: MYSQL_DATABASE
    label: Database
    default: "app"
  - name: MYSQL_USER
    label: User
    default: "app"
  - name: MYSQL_PASSWORD
    label: User password
    default: "__RANDOM__"
    secret: true
---
services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD={{MYSQL_ROOT_PASSWORD}}
      - MYSQL_DATABASE={{MYSQL_DATABASE}}
      - MYSQL_USER={{MYSQL_USER}}
      - MYSQL_PASSWORD={{MYSQL_PASSWORD}}
    ports:
      - "{{HOST_PORT}}:3306"
    volumes:
      - ./data:/var/lib/mysql
