---
name: Ubuntu VNC desktop
desc: Classic noVNC + VNC remote desktop (lightweight LXDE)
category: remote
tags: [vnc, novnc, desktop]
featured: true
ports: ["6080", "5901"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: |
  Open the noVNC port in a browser, or point a VNC client at port 5901 (the container listens
  on 5900; the host port defaults to 5901 to stay clear of the built-in macOS Screen Sharing).
  The default resolution can be adjusted inside the container.
vars:
  - name: HOST_PORT
    label: noVNC web port
    default: "6080"
  - name: VNC_PORT
    label: VNC port
    default: "5901"
  - name: VNC_PASSWORD
    label: VNC password
    default: "__RANDOM__"
    secret: true
    help: Keep it to 8 characters or fewer for best client compatibility
  - name: RESOLUTION
    label: Resolution
    default: "1280x800"
---
services:
  ubuntu-vnc:
    image: dorowu/ubuntu-desktop-lxde-vnc:latest
    container_name: ubuntu-vnc
    environment:
      - VNC_PASSWORD={{VNC_PASSWORD}}
      - RESOLUTION={{RESOLUTION}}
    ports:
      - "{{HOST_PORT}}:80"
      - "{{VNC_PORT}}:5900"
    volumes:
      - ./data:/home/ubuntu/data
    restart: unless-stopped
