---
name: Vaultwarden
desc: Lightweight Bitwarden-compatible password vault
category: security
tags: [password, vault]
featured: true
ports: ["8222"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: Expose this on your LAN only, or through a reverse proxy with HTTPS. ADMIN_TOKEN unlocks the admin page.
vars:
  - name: HOST_PORT
    label: Port
    default: "8222"
  - name: ADMIN_TOKEN
    label: Admin token
    default: "__RANDOM__"
    secret: true
---
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN={{ADMIN_TOKEN}}
      - SIGNUPS_ALLOWED=true
    volumes:
      - ./data:/data
    ports:
      - "{{HOST_PORT}}:80"
