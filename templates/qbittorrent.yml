---
name: qBittorrent
desc: BitTorrent / PT download client · web UI
category: download
tags: [bt, download]
featured: true
ports: ["8081", "6881"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: The default user is admin. On recent versions, check the startup logs for the temporary password.
vars:
  - name: HOST_PORT
    label: Web port
    default: "8081"
  - name: DOWNLOADS
    label: Downloads folder
    default: "{{SERVICES}}/qbittorrent/downloads"
  - name: TZ
    label: Time zone
    default: "{{TZ}}"
---
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{TZ}}
      - WEBUI_PORT={{HOST_PORT}}
    volumes:
      - ./config:/config
      - "{{DOWNLOADS}}:/downloads"
    ports:
      - "{{HOST_PORT}}:{{HOST_PORT}}"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
