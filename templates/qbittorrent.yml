---
name: qBittorrent
desc: BT/PT 下载客户端 · Web UI
category: download
tags: [bt, download]
featured: true
ports: ["8081", "6881"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: 默认用户 admin，首次启动看日志里的临时密码（较新版本）。
vars:
  - name: HOST_PORT
    label: Web 端口
    default: "8081"
  - name: DOWNLOADS
    label: 下载目录
    default: "{{SERVICES}}/qbittorrent/downloads"
  - name: TZ
    label: 时区
    default: "Asia/Shanghai"
---
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ={{TZ}}
      - WEBUI_PORT={{HOST_PORT}}
    volumes:
      - ./config:/config
      - "{{DOWNLOADS}}:/downloads"
    ports:
      - "{{HOST_PORT}}:{{HOST_PORT}}"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
