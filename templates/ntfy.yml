---
name: ntfy
desc: Self-hosted push notifications · works with ServerHub and script alerts
category: notify
tags: [notify, push]
featured: true
ports: ["2586"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: Port
    default: "2586"
---
services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ={{TZ}}
    volumes:
      - ./data:/var/cache/ntfy
      - ./config:/etc/ntfy
    ports:
      - "{{HOST_PORT}}:80"
    restart: unless-stopped
