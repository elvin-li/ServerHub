---
name: FileBrowser
desc: Web-based file manager (this host prefers the native FileBrowser template)
category: files
ports: ["8085"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
notes: >
  SHARE_ROOT is the only directory exposed over the web UI. It defaults to
  ~/Services/media rather than your whole home directory — widen it only if you
  intend every file under that path to be downloadable by anyone who can sign in.
vars:
  - name: HOST_PORT
    label: Web port
    default: "8085"
  - name: SHARE_ROOT
    label: Directory to expose
    default: "{{SERVICES}}/media"
    help: Only this subtree is served. Avoid your home directory.
---
# Reference only — this host runs native FileBrowser via launchd (port 8125)
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "{{HOST_PORT}}:80"
    volumes:
      - "{{SHARE_ROOT}}:/srv"
      - ./filebrowser.db:/database.db
