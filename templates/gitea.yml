---
name: Gitea
desc: Lightweight self-hosted Git service
category: dev
tags: [git, forge]
featured: true
ports: ["3030", "2222"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
vars:
  - name: HOST_PORT
    label: Web port
    default: "3030"
  - name: SSH_PORT
    label: SSH port
    default: "2222"
---
services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN={{HOST_IP}}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://{{HOST_IP}}:{{HOST_PORT}}/
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "{{HOST_PORT}}:3000"
      - "{{SSH_PORT}}:22"
