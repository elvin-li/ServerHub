---
name: Cloudflare Tunnel (Docker)
desc: Run cloudflared in a container (a Zero Trust token is required) · on this Mac, prefer "Cloudflared (native)"
vars:
  - name: TUNNEL_TOKEN
    label: Tunnel Token
    default: ""
    required: true
    secret: true
    help: Cloudflare Zero Trust → Networks → Tunnels → copy the token shown during setup. The container will not start if this is blank.
category: network
tags: [tunnel, cloudflare]
featured: false
notes: |
  We recommend the "Cloudflared (native)" app in the store first (brew CLI, much lighter).
  This Docker template is for you if you already have a Cloudflare Tunnel token and want to run it through compose.
  Installing without a token will fail, as the token is required.
---
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token {{TUNNEL_TOKEN}}
