---
name: Cloudflare Tunnel（Docker）
desc: 用容器跑 cloudflared（必须填 Zero Trust Token）· 本机优先装「Cloudflared（原生）」
vars:
  - name: TUNNEL_TOKEN
    label: Tunnel Token
    default: ""
    required: true
    secret: true
    help: Cloudflare Zero Trust → Networks → Tunnels → 安装时复制 token。留空无法启动。
category: network
tags: [tunnel, cloudflare]
featured: false
notes: |
  推荐优先安装应用商店里的「Cloudflared（原生）」（brew CLI，更轻）。
  本 Docker 模板适合：已有 Cloudflare Tunnel Token、希望用 compose 托管。
  无 Token 点安装会失败（必填）。
---
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token {{TUNNEL_TOKEN}}
