---
name: Navidrome
desc: Lightweight music server (Subsonic compatible)
vars:
  - name: HOST_PORT
    label: Web port
    default: "4533"
  - name: MUSIC_PATH
    label: Music library path
    default: "{{HOME}}/Music"
    help: Absolute path to the music directory on the host
category: media
tags: [music]
ports: ["4533"]
url_template: "http://{{HOST_IP}}:{{HOST_PORT}}"
---
services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "{{HOST_PORT}}:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - ./data:/data
      - "{{MUSIC_PATH}}:/music:ro"
